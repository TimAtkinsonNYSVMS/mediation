<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request mediation step 3 on phone</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="portal.css">
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#0f7bb3}a:hover{color:#0a5a85}</style>
<div class="app phone" style="width: 390px; min-height: 1500px;">
<header class="hdr"><div class="hdr-in"><img src="nysvms-logo-on-dark.png" alt="New York State Veterinary Medical Society"><span class="prod" style="padding-left: 10px;">Mediation</span></div></header>
<main class="wrap stack" style="gap: 20px;">
<div class="stack g8">
<p class="eyebrow">Step 3 of 4</p>
<h1 class="t1" style="font-size: 28px;">What happened</h1>
</div>
<ol class="steps" aria-label="Form progress: step 3 of 4">
<li class="done"><span class="bar"></span><span class="sm" style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Check we can help</span></li>
<li class="done"><span class="bar"></span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Your veterinarian</span></li>
<li class="now"><span class="bar"></span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">What happened</span></li>
<li><span class="bar"></span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">About you</span></li>
</ol>
<div class="field"><label for="one">In one sentence, what would you like help with?</label><input id="one" class="input" value="Questions about my dog's dosing"><span class="help">This becomes the title of your request.</span></div>
<div class="field"><label for="wh">What happened</label><textarea id="wh" class="textarea" style="min-height: 180px;" placeholder="When was the visit? What were you told? What would you like to understand?"></textarea></div>
<div class="field"><span class="lbl">Records, photos or other documents <span class="opt">(optional)</span></span>
<div class="drop" style="flex-direction: column; align-items: flex-start; gap: 8px;"><button class="btn2" type="button" style="background: #ffffff;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>Add files</button><span class="sm muted">Up to 4 MB per file</span></div></div>
<label class="choice"><input type="checkbox"><span class="stack g4"><span>I give my veterinarian permission to share my pet's records with NYSVMS.</span><span class="sm muted">Helps your facilitator understand the care.</span></span></label>
<div class="field"><span class="lbl">Signed records release form <span class="opt">(optional)</span></span><button class="btn2" type="button" style="align-self: flex-start;">Add the form</button></div>
</main>
<div class="sticky-bar"><a class="btn2" href="02-Request-form.html" style="flex: 1;">Back</a><a class="btn" href="03-Request-received.html" style="flex: 2;">Continue</a></div>
</div>
</body>
</html>
